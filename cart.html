<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <link rel="stylesheet" href="flexs.css">
  <style>
    /* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

/* Page background */
body {
  background: #f4f6f9;
  padding: 40px 20px;
}

/* Cart Title */
h1 {
  text-align: center;
  margin-bottom: 30px;
  font-size: 32px;
}

/* Cart Container */
#carItems {
  max-width: 700px;
  margin: auto;
}

/* Cart Item Card */
.cart-item {
  background: #fff;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}

/* Item Name */
.cart-item h3 {
  font-size: 18px;
}

/* Price + Quantity */
.cart-details {
  text-align: right;
}

.cart-details p {
  margin-bottom: 5px;
  font-size: 14px;
}

/* Remove Button */
.remove-btn {
  background: crimson;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
}

.remove-btn:hover {
  background: darkred;
}

/* Total Section */
.total-box {
  margin-top: 25px;
  padding: 20px;
  background: #fff;
  border-radius: 10px;
  text-align: right;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}

.total-box h2 {
  font-size: 20px;
}

/* Checkout Button */
.checkout-btn {
  margin-top: 15px;
  background: #ff6600;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
}

.checkout-btn:hover {
  background: #e65c00;
}

/* Empty Cart */
.empty {
  text-align: center;
  font-size: 20px;
  margin-top: 50px;
  color: gray;
}

/* Responsive */
@media (max-width: 600px) {
  .cart-item {
    flex-direction: column;
    align-items: flex-start;
  }

  .cart-details {
    text-align: left;
    margin-top: 10px;
  }

  .total-box {
    text-align: left;
  }
}
/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

/* Background */
body {
  background: linear-gradient(135deg, #fff4e6, #ffe0cc);
  padding: 40px 20px;
}

/* Title */
h1 {
  text-align: center;
  margin-bottom: 30px;
  font-size: 34px;
  color: #e65c00;
}

/* Cart Container */
#carItems {
  max-width: 750px;
  margin: auto;
}

/* Cart Card */
.cart-item {
  background: white;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
  border-left: 6px solid #ff6600;
  transition: 0.3s ease;
}

.cart-item:hover {
  transform: translateY(-4px);
}

/* Item Name */
.cart-item h3 {
  font-size: 20px;
  color: #333;
}

/* Details */
.cart-details p {
  margin-bottom: 6px;
  font-size: 14px;
  color: #555;
}

/* Remove Button */
.remove-btn {
  background: #ff4d4d;
  color: white;
  border: none;
  padding: 7px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: 0.3s;
}

.remove-btn:hover {
  background: #cc0000;
}

/* Total Box */
.total-box {
  margin-top: 30px;
  padding: 25px;
  background: white;
  border-radius: 15px;
  text-align: right;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
  border-top: 5px solid #28a745;
}

.total-box h2 {
  font-size: 22px;
  color: #28a745;
}

/* Checkout Button */
.checkout-btn {
  margin-top: 15px;
  background: linear-gradient(45deg, #ff6600, #ff8533);
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  transition: 0.3s;
}

.checkout-btn:hover {
  background: linear-gradient(45deg, #e65c00, #ff6600);
  transform: scale(1.05);
}

/* Empty Cart */
.empty {
  text-align: center;
  font-size: 22px;
  margin-top: 60px;
  color: #888;
}

/* Responsive */
@media (max-width: 600px) {
  .cart-item {
    flex-direction: column;
    align-items: flex-start;
  }

  .cart-details {
    margin-top: 10px;
    text-align: left;
  }

  .total-box {
    text-align: left;
  }
}
  </style>
</head>
<body>
    <div id="docs"></div>
    <h1>Your Cart</h1>
<div id="carItems"></div>


<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let container = document.getElementById("carItems");

if (cart.length === 0) {
  container.innerHTML = "<h2>Your cart is empty</h2>";
} else {
  cart.forEach(item => {
    container.innerHTML += `
      <p>
        ${item.name} - $${item.price} × ${item.quantity}
      </p>
    `;
  });


  <div class="cart-item">
    <h3>${item.name}</h3>
    <div class="cart-details">
      <p>Price: $${item.price}</p>
      <p>Quantity: ${item.quantity}</p>
      <p>Total: $${item.price * item.quantity}</p>
      <button class="remove-btn" onclick="removeItem('${item.name}')">
        Remove
      </button>
    </div>
  </div>
`;
</script>
<script src="home.js"></script>
</body>
</html>
